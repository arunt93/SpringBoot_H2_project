spring.application.name=user-service
server.port=8092

# Database Configuration (for Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/User_Database}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:MyStrongPassword123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt-secret=${JWT_SECRET:JWTSuperSecretKeyForUserManagementSystem2024!@#$%^&*()_+-={}[]|:;<>?,./}
app.jwt-expiration-milliseconds=900000

# Eureka Client Configuration
eureka.client.service-url.default-zone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# Health check endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always