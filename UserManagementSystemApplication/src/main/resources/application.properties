spring.application.name=UserManagementSystemApplication
server.port=8092

# Database Configuration (Local Development)
spring.datasource.url=jdbc:mysql://localhost:3306/User_Database?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=MyStrongPassword123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt-secret=mySecretKeyForJWTAuthenticationThatShouldBeLongEnoughAndSecureForHS512AlgorithmRequirements512BitsMinimum
app.jwt-expiration-milliseconds=86400000

# Redis Configuration
spring.data.redis.host=redis-15257.c305.ap-south-1-1.ec2.cloud.redislabs.com
spring.data.redis.port=15257
spring.data.redis.password=UClSPed0OYNi3UIbKE6o6AVCvRQOzqxw
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Health check endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Eureka Server Configuration
eureka.client.service-url.default-zone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true