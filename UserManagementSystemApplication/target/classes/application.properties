spring.application.name=UserManagementSystemApplication
server.port= 8092

spring.datasource.url=jdbc:mysql://localhost:3306/User_Database
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=MyStrongPassword123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt-secret=mySecretKeyForJWTAuthenticationThatShouldBeLongEnough
app.jwt-expiration-milliseconds=86400000